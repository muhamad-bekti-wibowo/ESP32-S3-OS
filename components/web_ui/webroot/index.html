<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ESP32 FBD Editor</title>
<link rel="stylesheet" href="drawflow.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="palette">
  <h3>Node</h3>
  <input type="text" id="palette-search" placeholder="Cari node..." autocomplete="off">
  <div id="palette-list"></div>
</div>

<div id="drawflow" class="drawflow-wrap"></div>

<div id="properties">
  <h3>Properties</h3>
  <div id="properties-body"></div>
</div>

<div id="toolbar">
  <button onclick="saveProgram()">Save</button>
  <button onclick="loadProgram()">Load</button>
  <button id="toolbar-live-btn" onclick="toggleLiveMonitor()">Live: OFF</button>
  <a href="/network.html" id="toolbar-network-link">System &gt; Network</a>
  <a href="/ota.html" id="toolbar-ota-link">System &gt; Firmware</a>
  <span id="toolbar-status"></span>
</div>

<script src="drawflow.min.js"></script>
<script src="icons.js"></script>
<script src="node-types.js"></script>
<script src="app.js"></script>
</body>
</html>
